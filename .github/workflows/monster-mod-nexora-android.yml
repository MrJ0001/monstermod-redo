name: MonsterMod Nexora Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monster-mod-nexora-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build libmonster_mm.so
    runs-on: ubuntu-24.04

    steps:
      - name: Check out JulianR0 MonsterMod sources
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compile Android ARM64 Metamod plugin
        shell: bash
        run: |
          set -euo pipefail
          touch build.log
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(monster_mod_nexora LANGUAGES CXX)
          if(NOT ANDROID OR NOT ANDROID_ABI STREQUAL "arm64-v8a")
            message(FATAL_ERROR "This build requires Android arm64-v8a")
          endif()
          file(GLOB MONSTER_SOURCES CONFIGURE_DEPENDS "${CMAKE_SOURCE_DIR}/src/dlls/*.cpp")
          if(NOT MONSTER_SOURCES)
            message(FATAL_ERROR "JulianR0 MonsterMod sources were not found")
          endif()
          add_library(monster_mm SHARED ${MONSTER_SOURCES})
          set_target_properties(monster_mm PROPERTIES
            CXX_STANDARD 14 CXX_STANDARD_REQUIRED YES
            OUTPUT_NAME monster_mm PREFIX lib
            POSITION_INDEPENDENT_CODE YES)
          target_include_directories(monster_mm PRIVATE
            src/dlls src/engine src/common src/pm_shared src/metamod)
          target_compile_definitions(monster_mm PRIVATE
            linux=1 stricmp=strcasecmp strcmpi=strcasecmp NDEBUG)
          target_compile_options(monster_mm PRIVATE
            -O2 -fPIC -fno-strict-aliasing -Wno-everything)
          target_link_libraries(monster_mm PRIVATE dl m)
          target_link_options(monster_mm PRIVATE -Wl,--no-undefined)
          CMAKE

          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee -a build.log
          cmake --build build-android --parallel 2>&1 | tee -a build.log

          mkdir -p output/arm64-v8a
          cp build-android/libmonster_mm.so output/arm64-v8a/libmonster_mm.so
          cp cfg/monster_precache.cfg output/monster_precache.cfg
          cp cfg/monster_skill.cfg output/monster_skill.cfg

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/llvm-readelf" -h output/arm64-v8a/libmonster_mm.so \
            | grep -E 'Class:|Machine:' | tee -a build.log
          for symbol in Meta_Query Meta_Attach Meta_Detach GiveFnptrsToDll; do
            if ! "$NDK_BIN/llvm-nm" -D output/arm64-v8a/libmonster_mm.so \
              | grep -Eq "[[:space:]]${symbol}$"; then
              echo "Missing Metamod export: $symbol" | tee -a build.log
              exit 1
            fi
          done
          echo 'Compilation succeeded. Android gameplay compatibility remains UNTESTED.' | tee -a build.log

      - name: Upload build files and compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MonsterMod-Nexora-ARM64-build
          path: |
            output/
            build.log
          if-no-files-found: warn
